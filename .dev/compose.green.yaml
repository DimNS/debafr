# Dev-стенд: см. compose.blue.yaml. Тот же проект (name: debafr), поэтому
# compose считает сервисы другого файла сиротами и не удаляет их — без
# --remove-orphans синий продолжает работать, пока поднимается зелёный.
name: debafr

services:
  green_api:
    image: nginx:${APP_VERSION}
    container_name: debafr_green_${APP_VERSION}_api
    labels:
      - "app.project.name=debafr"
      - "app.service.name=api"
      - "app.service.type=backend"
      - "app.deployment.strategy=green"
      - "app.version=${APP_VERSION}"
    ports:
      - "3011:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15

  green_ui:
    image: nginx:${APP_VERSION}
    container_name: debafr_green_${APP_VERSION}_ui
    labels:
      - "app.project.name=debafr"
      - "app.service.name=ui"
      - "app.service.type=frontend"
      - "app.deployment.strategy=green"
      - "app.version=${APP_VERSION}"
    ports:
      - "3012:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15
