# Dev-стенд: вместо настоящего приложения крутится один и тот же nginx.
# Задача стенда — прогнать пайплайн (compose up, healthcheck, остановка
# старой версии), а не проверить само приложение.
name: debafr

services:
  blue_api:
    # Тег подставляется приложением из введённой версии (см. README.md).
    # Alpine — самый лёгкий образ: в нём wget из busybox, на нём healthcheck.
    image: nginx:${APP_VERSION}
    container_name: debafr_blue_${APP_VERSION}_api
    labels:
      - "app.project.name=debafr"
      - "app.service.name=api"
      - "app.service.type=backend"
      - "app.deployment.strategy=blue"
      - "app.version=${APP_VERSION}"
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15

  blue_ui:
    image: nginx:${APP_VERSION}
    container_name: debafr_blue_${APP_VERSION}_ui
    labels:
      - "app.project.name=debafr"
      - "app.service.name=ui"
      - "app.service.type=frontend"
      - "app.deployment.strategy=blue"
      - "app.version=${APP_VERSION}"
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 2s
      timeout: 2s
      retries: 15
