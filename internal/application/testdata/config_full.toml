[app]
project_name = "myapp"
images = [
    "ghcr.io/myapp/api",
    "ghcr.io/myapp/ui",
]

# Замена значения текущей стратегии на значение следующей в произвольном
# файле при переключении. На update blue меняется на green и наоборот.
[[app.replacer]]
path = "myapp.json"
blue = "myapp_blue_api:8080"
green = "myapp_green_api:8080"

[docker_login]
enabled = true
registry = "ghcr.io"
username = "username2"
password = "password2"

[files]
compose_blue = "myapp_compose.blue.yaml"
compose_green = "myapp_compose.green.yaml"
nginx_conf = "myapp_nginx.conf"

[binpaths]
docker = "docker"
curl = "curl"
nginx = "nginx"

[timeouts]
default = "120s"

[healthcheck]
max_retries = 5
retry_delay = "10s"

[nginx]
enabled = true
test = ["nginx", "-t"]
reload = ["nginx", "-s", "reload"]
