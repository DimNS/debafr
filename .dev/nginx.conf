# Dev-конфиг nginx. Как и в бою, это server-блок, а не полный конфиг:
# он попадает в контейнер как /etc/nginx/conf.d/nginx.conf и подхватывается
# include-директивой из штатного nginx.conf.
#
# Приложение правит ТОЛЬКО строки proxy_pass, и делает это глобальной заменой
# (strings.ReplaceAll): активная строка комментируется, следующая
# раскомментируется, во ВСЕХ местах файла сразу. Поэтому:
#   * активная строка пишется вплотную к '#', без пробела;
#   * за префиксом "proxy_pass http://127.0.0.1:" нельзя писать его же в
#     комментариях — замена сожрала бы и комментарий.
# Порядок строк и отступы менять нельзя.
#
# Изначально ВСЁ закомментировано, и это не украшение: на install у
# приложения нет текущей стратегии, оно только раскомментирует следующую. Если
# оставить что-то активным, в одном location окажется два proxy_pass и nginx -t
# упадёт.
server {
    # 8080, а не 80: на машине разработчика порт 80 уже занят.
    listen 8080;
    server_name localhost;

    location /api {
        #proxy_pass http://127.0.0.1:3001; # blue
        #proxy_pass http://127.0.0.1:3011; # green
        proxy_set_header Host $host;
    }

    # /ws намеренно смотрит на тот же порт, что и / — это проверка того, что
    # приложение меняет все вхождения порта, а не только первое. При
    # переключении blue<->green комментируются и раскомментируются сразу обе
    # строки в /ws и в /.
    location /ws {
        #proxy_pass http://127.0.0.1:3002; # blue
        #proxy_pass http://127.0.0.1:3012; # green
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        #proxy_pass http://127.0.0.1:3002; # blue
        #proxy_pass http://127.0.0.1:3012; # green
        proxy_set_header Host $host;
    }
}
