# Конфиг dev-стенда. Подробности — в .dev/README.md.
#
# Приложение читает debafr.toml из CWD, а `make dev` запускает бинарь из .dev/,
# поэтому конфиг лежит рядом с бинарём, compose-файлами и nginx.conf.
# Все пути ниже — относительно этого каталога.

[app]
# Должно совпадать с name в compose.*.yaml и с app.project.name в их labels.
project_name = "debafr"

# Фейковое приложение: один и тот же публичный образ на все сервисы.
# Приложение дописывает ":" + введённую версию, т.е. тянется nginx:<версия>.
# В README.md зафиксированы версии для install и update.
images = ["nginx"]

# Замена значений при переключении стратегии: на каждом update значение
# текущей стратегии в файле меняется на значение следующей (blue -> green
# и наоборот). Файл должен существовать; `make dev` создаёт его, если нет.
[[app.replacer]]
path = "debafr.json"
blue = "blue_api:80"
green = "green_api:80"

# nginx.conf содержит по одной активной строке proxy_pass на location.
# Записи ниже переключают их между blue- и green-портами. /ws и / смотрят
# на один порт, поэтому одной пары хватает на оба location'а.
[[app.replacer]]
path = "nginx.conf"
blue = "proxy_pass http://127.0.0.1:3001;"
green = "proxy_pass http://127.0.0.1:3011;"

[[app.replacer]]
path = "nginx.conf"
blue = "proxy_pass http://127.0.0.1:3002;"
green = "proxy_pass http://127.0.0.1:3012;"

[files]
compose_blue = "compose.blue.yaml"
compose_green = "compose.green.yaml"
nginx_conf = "nginx.conf"

[binpaths]
docker = "docker"
curl = "curl"

# Системного nginx в стенде нет, вместо него обёртка над docker exec.
# Используется для проверки версии на шаге Requirements.
nginx = "./nginx.sh"

# enabled = false отключает проверку версии и шаг Switching strategy целиком.
# Команды задаются массивом argv, без shell.
[nginx]
enabled = true
test = ["./nginx.sh", "-t"]
reload = ["./nginx.sh", "-s", "reload"]
