# Dev-конфиг nginx. Как и в бою, это server-блок, а не полный конфиг:
# он попадает в контейнер как /etc/nginx/conf.d/nginx.conf и подхватывается
# include-директивой из штатного nginx.conf.
#
# В каждом location одна активная строка proxy_pass. debafr не разбирает
# nginx-специфику: он просто заменяет blue-значения на green (и наоборот)
# через [[app.replacer]] в debafr.toml, а затем выполняет команды из [nginx].
#
# /ws намеренно смотрит на тот же порт, что и /: замена глобальная и должна
# поменять оба location'а разом.
server {
    # 8080, а не 80: на машине разработчика порт 80 уже занят.
    listen 8080;
    server_name localhost;

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }
}
